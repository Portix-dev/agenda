<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#185FA5" id="theme-meta">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Agenda">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Agenda · Engrenagens de Tempo</title>
<style>
:root{--ff:'Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif;--nb1:#fff;--nb2:#fafafa;--nb3:#f5f5f5;--nb4:#ebebeb;--nf1:#242424;--nf2:#424242;--nf3:#717171;--brd:rgba(0,0,0,.13);--brd2:rgba(0,0,0,.24);--sh2:0 1px 2px rgba(0,0,0,.10),0 0 1px rgba(0,0,0,.08);--sh4:0 2px 4px rgba(0,0,0,.10),0 0 2px rgba(0,0,0,.08);--r4:4px;--r8:8px;--cat-trabalho-bg:#E6F1FB;--cat-trabalho-fg:#0C447C;--cat-trabalho-acc:#185FA5;--cat-estudo-bg:#E1F5EE;--cat-estudo-fg:#085041;--cat-estudo-acc:#0F6E56;--cat-eea-bg:#EEEDFE;--cat-eea-fg:#3C3489;--cat-eea-acc:#534AB7;--cat-projeto-bg:#FAEEDA;--cat-projeto-fg:#633806;--cat-projeto-acc:#854F0B;--cat-leitura-bg:#F1EFE8;--cat-leitura-fg:#444441;--cat-leitura-acc:#5F5E5A;--active-acc:#185FA5;--active-bg:#E6F1FB;--active-fg:#0C447C}
@media(prefers-color-scheme:dark){:root{--nb1:#1e1e1e;--nb2:#161616;--nb3:#212121;--nb4:#2a2a2a;--nf1:#f0f0f0;--nf2:#c0c0c0;--nf3:#888;--brd:rgba(255,255,255,.12);--brd2:rgba(255,255,255,.24);--sh2:0 1px 2px rgba(0,0,0,.40),0 0 1px rgba(0,0,0,.30);--sh4:0 2px 4px rgba(0,0,0,.40),0 0 2px rgba(0,0,0,.30);--cat-trabalho-bg:#0C2A4A;--cat-trabalho-fg:#85B7EB;--cat-trabalho-acc:#378ADD;--cat-estudo-bg:#062E1E;--cat-estudo-fg:#5DCAA5;--cat-estudo-acc:#1D9E75;--cat-eea-bg:#1E1A42;--cat-eea-fg:#AFA9EC;--cat-eea-acc:#7F77DD;--cat-projeto-bg:#2E1E06;--cat-projeto-fg:#FAC775;--cat-projeto-acc:#EF9F27;--cat-leitura-bg:#282826;--cat-leitura-fg:#B4B2A9;--cat-leitura-acc:#888780;--active-acc:#378ADD;--active-bg:#0C2A4A;--active-fg:#85B7EB}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important}}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--ff);font-size:14px;color:var(--nf1);background:var(--nb2);min-height:100vh;padding:max(env(safe-area-inset-top),12px) 12px max(env(safe-area-inset-bottom),24px)}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.card{background:var(--nb1);border:.5px solid var(--brd);border-radius:var(--r8);padding:14px 18px;box-shadow:var(--sh4)}
.card-sm{padding:10px 14px;box-shadow:var(--sh2)}
.sec-lbl{font-size:10px;font-weight:600;color:var(--nf3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px}
.hdr-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.hdr-title{font-size:15px;font-weight:600;color:var(--nf1)}
.hdr-sub{font-size:11px;color:var(--nf3);margin-top:2px}
.day-badge{font-size:11px;font-weight:600;padding:3px 11px;border-radius:20px;background:var(--nb3);color:var(--nf2);border:.5px solid var(--brd2)}
.nav-btn{font-size:13px;font-weight:600;padding:3px 10px;border-radius:var(--r4);border:.5px solid var(--brd2);background:var(--nb1);color:var(--nf2);cursor:pointer}
.nav-btn:active{background:var(--nb3)}
.gears-stage{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;padding:4px 0 10px}
.gear-wrap{display:flex;flex-direction:column;align-items:center;gap:5px}
.gear-lbl-top{font-size:9px;font-weight:600;color:var(--nf3);text-transform:uppercase;letter-spacing:.06em}
.gear-lbl-bot{font-size:10px;color:var(--nf3);text-align:center}
.ratio-col{display:flex;flex-direction:column;align-items:center;gap:2px;padding-top:6px}
.ratio-line{width:1px;height:16px;background:var(--brd2)}
.ratio-txt{font-size:11px;font-weight:600;color:var(--nf3)}
.leg-row{display:flex;gap:10px;flex-wrap:wrap;padding-top:10px;border-top:.5px solid var(--brd)}
.leg-item{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--nf3)}
.leg-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.timer-grid{display:grid;grid-template-columns:100px 1fr;gap:14px;align-items:center}
.timer-num{font-size:32px;font-weight:600;color:var(--nf1);font-variant-numeric:tabular-nums;line-height:1}
.timer-task{font-size:12px;color:var(--nf2);margin:4px 0 10px;min-height:16px}
.preset-row{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.pbtn{font-family:var(--ff);font-size:11px;font-weight:600;padding:3px 10px;border-radius:var(--r4);border:.5px solid var(--brd2);background:var(--nb3);color:var(--nf2);cursor:pointer}
.pbtn.sel{background:var(--active-bg);color:var(--active-fg);border-color:var(--active-acc)}
.btn-row{display:flex;gap:6px}
.cbtn{font-family:var(--ff);font-size:12px;font-weight:600;padding:6px 16px;border-radius:var(--r4);border:.5px solid var(--brd2);background:var(--nb1);color:var(--nf1);cursor:pointer}
.cbtn:active{background:var(--nb3)}
.cbtn.go{background:var(--active-acc);color:#fff;border-color:var(--active-acc)}
.tasks-list{display:flex;flex-direction:column;gap:5px}
.task-row{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--r4);border:.5px solid var(--brd);cursor:pointer;user-select:none}
.task-row.done{opacity:.38}
.task-check{width:17px;height:17px;border-radius:3px;border:1.5px solid var(--brd2);display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0;color:#107c10}
.task-row.done .task-check{background:#dff6dd;border-color:#107c10}
.task-slot{font-size:10px;font-weight:600;color:var(--nf3);min-width:36px}
.task-name{font-size:13px;font-weight:500;color:var(--nf1);flex:1}
.cat-pill{font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;white-space:nowrap}
.week-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wday{border-radius:var(--r4);border:.5px solid var(--brd);background:var(--nb2);padding:6px 4px;text-align:center;cursor:pointer}
.wday:active{background:var(--nb3)}
.wday.active-day{border-color:var(--active-acc);background:var(--active-bg)}
.wday-name{font-size:9px;font-weight:600;color:var(--nf3);text-transform:uppercase}
.wday-num{font-size:13px;font-weight:600;color:var(--nf2);margin-top:1px}
.wday-dot{width:5px;height:5px;border-radius:50%;margin:3px auto 0;background:var(--active-acc);opacity:0}
.wday.has-done .wday-dot{opacity:1}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--nb2);border-radius:var(--r4);padding:10px;text-align:center;border:.5px solid var(--brd)}
.stat-n{font-size:22px;font-weight:600;color:var(--nf1)}
.stat-l{font-size:10px;color:var(--nf3);margin-top:1px}
.notes-ta{font-family:var(--ff);font-size:13px;width:100%;resize:vertical;min-height:48px;padding:8px 10px;border-radius:var(--r4);border:.5px solid var(--brd2);background:var(--nb2);color:var(--nf1);outline:none}
.notes-ta:focus{border:1.5px solid var(--active-acc)}
#install-banner{display:none;background:var(--active-bg);border:.5px solid var(--active-acc);border-radius:var(--r8);padding:10px 14px;font-size:12px;color:var(--active-fg);align-items:center;justify-content:space-between;gap:8px}
#install-banner.show{display:flex}
#install-btn{font-family:var(--ff);font-size:12px;font-weight:600;padding:4px 12px;border-radius:var(--r4);border:none;background:var(--active-acc);color:#fff;cursor:pointer}
</style>
</head>
<body>
<div class="wrap" id="app">

<div class="card card-sm">
  <div class="hdr-row">
    <div>
      <div class="hdr-title">Agenda · <span id="hd-day"></span></div>
      <div class="hdr-sub" id="hd-date"></div>
    </div>
    <div style="display:flex;gap:6px;align-items:center">
      <span class="day-badge" id="block-badge"></span>
      <button class="nav-btn" onclick="prevDay()">‹</button>
      <button class="nav-btn" onclick="nextDay()">›</button>
    </div>
  </div>
</div>

<div id="install-banner">
  <span>Instalar como app na tela inicial</span>
  <button id="install-btn" onclick="installPWA()">Instalar</button>
</div>

<div class="card">
  <div class="sec-lbl">Engrenagens de tempo</div>
  <div class="gears-stage">
    <div class="gear-wrap">
      <div class="gear-lbl-top">Bloco</div>
      <svg width="72" height="72" viewBox="0 0 72 72" style="cursor:pointer" onclick="toggleTimer()" role="img" aria-label="Disco do bloco">
        <circle cx="36" cy="36" r="33" fill="var(--nb3)" stroke="var(--brd)" stroke-width=".5"/>
        <path id="arc-bloco" d=""/>
        <circle cx="36" cy="36" r="20" fill="var(--nb1)"/>
        <text x="36" y="33" text-anchor="middle" font-family="var(--ff)" font-size="10" font-weight="600" fill="var(--nf1)" id="lbl-bloco">40</text>
        <text x="36" y="43" text-anchor="middle" font-family="var(--ff)" font-size="6.5" fill="var(--nf3)">min</text>
      </svg>
      <div class="gear-lbl-bot" id="bot-bloco">40 min</div>
    </div>
    <div class="ratio-col"><div class="ratio-line"></div><div class="ratio-txt" id="ratio1">1/5</div><div class="ratio-line"></div></div>
    <div class="gear-wrap">
      <div class="gear-lbl-top">Foco do dia</div>
      <svg width="116" height="116" viewBox="0 0 116 116" role="img" aria-label="Foco do dia">
        <circle cx="58" cy="58" r="54" fill="var(--nb3)" stroke="var(--brd)" stroke-width=".5"/>
        <path id="arc-foco" d="" fill="#0F6E56" opacity=".85"/>
        <circle cx="58" cy="58" r="34" fill="var(--nb1)"/>
        <text x="58" y="55" text-anchor="middle" font-family="var(--ff)" font-size="13" font-weight="600" fill="var(--nf1)" id="lbl-foco">5</text>
        <text x="58" y="67" text-anchor="middle" font-family="var(--ff)" font-size="7" fill="var(--nf3)">blocos</text>
      </svg>
      <div class="gear-lbl-bot" id="bot-foco">200 min foco</div>
    </div>
    <div class="ratio-col"><div class="ratio-line"></div><div class="ratio-txt" id="ratio2">1/7</div><div class="ratio-line"></div></div>
    <div class="gear-wrap">
      <div class="gear-lbl-top">Dia completo</div>
      <svg width="170" height="170" viewBox="0 0 170 170" role="img" aria-label="Dia completo">
        <circle cx="85" cy="85" r="80" fill="var(--nb3)" stroke="var(--brd)" stroke-width=".5"/>
        <path id="arc-dia" d="" fill="#534AB7" opacity=".75"/>
        <circle cx="85" cy="85" r="50" fill="var(--nb1)"/>
        <text x="85" y="81" text-anchor="middle" font-family="var(--ff)" font-size="16" font-weight="600" fill="var(--nf1)" id="lbl-dia">0h00</text>
        <text x="85" y="96" text-anchor="middle" font-family="var(--ff)" font-size="8" fill="var(--nf3)">de 24h</text>
      </svg>
      <div class="gear-lbl-bot">1440 min / dia</div>
    </div>
  </div>
  <div class="leg-row">
    <div class="leg-item"><div class="leg-dot" style="background:#185FA5"></div>Bloco</div>
    <div class="leg-item"><div class="leg-dot" style="background:#0F6E56"></div>Foco (<span id="leg-n">5</span>× 40 min)</div>
    <div class="leg-item"><div class="leg-dot" style="background:#534AB7"></div>Dia completo</div>
  </div>
</div>

<div class="card">
  <div class="sec-lbl">Time timer · <span id="timer-lbl">40 min / bloco</span></div>
  <div class="timer-grid">
    <svg width="100" height="100" viewBox="0 0 100 100" style="cursor:pointer" onclick="toggleTimer()" role="img" aria-label="Timer">
      <circle cx="50" cy="50" r="46" fill="var(--nb3)" stroke="var(--brd)" stroke-width=".5"/>
      <path id="tarc" d="" opacity=".9"/>
      <circle cx="50" cy="50" r="30" fill="var(--nb1)"/>
      <text x="50" y="47" text-anchor="middle" font-family="var(--ff)" font-size="13" font-weight="600" fill="var(--nf1)" id="svg-m">40</text>
      <text x="50" y="58" text-anchor="middle" font-family="var(--ff)" font-size="7.5" fill="var(--nf3)">min</text>
    </svg>
    <div>
      <div class="timer-num" id="t-display">40:00</div>
      <div class="timer-task" id="t-task">—</div>
      <div class="preset-row">
        <button class="pbtn sel" id="p40" onclick="setMins(40)">40 min</button>
        <button class="pbtn" id="p25" onclick="setMins(25)">25 min</button>
        <button class="pbtn" id="p20" onclick="setMins(20)">20 min</button>
        <button class="pbtn" id="p10" onclick="setMins(10)">10 min</button>
      </div>
      <div class="btn-row">
        <button class="cbtn go" id="play-btn" onclick="toggleTimer()">▶ Iniciar</button>
        <button class="cbtn" onclick="resetTimer()">↺</button>
      </div>
    </div>
  </div>
</div>

<div class="card card-sm">
  <div class="sec-lbl">Tarefas de hoje</div>
  <div class="tasks-list" id="today-tasks"></div>
</div>

<div class="card card-sm">
  <div class="sec-lbl">Semana</div>
  <div class="week-strip" id="week-strip"></div>
</div>

<div class="stat-row">
  <div class="stat"><div class="stat-n" id="s-done">0</div><div class="stat-l">blocos concluídos</div></div>
  <div class="stat"><div class="stat-n" id="s-mins">0</div><div class="stat-l">minutos hoje</div></div>
  <div class="stat"><div class="stat-n" id="s-streak">0</div><div class="stat-l">dias seguidos</div></div>
</div>

<div class="card card-sm">
  <div class="sec-lbl">Nota da sessão</div>
  <textarea class="notes-ta" id="notes-ta" rows="2" placeholder="Observações do dia..."></textarea>
</div>

</div>
<script>
const SCHED={1:[{s:'40min',t:'Leitura'},{s:'40min',t:'Projeto Gestão Financeira'},{s:'40min',t:'Projeto Gerador de Pareceres / Mascarador'},{s:'40min',t:'EEA – Página Argumento'},{s:'Diário',t:'Execução Diária (Trabalho)'}],2:[{s:'40min',t:'Espanhol'},{s:'40min',t:'Projeto Score BR'},{s:'40min',t:'Projeto Portix / Sites'},{s:'40min',t:'EEA – Leitura'},{s:'Diário',t:'Execução Diária (Trabalho)'}],3:[{s:'40min',t:'Inglês'},{s:'40min',t:'Leitura Inglês'},{s:'40min',t:'Estudos Contábeis'},{s:'40min',t:'EEA – Página Argumento'},{s:'Diário',t:'Execução Diária (Trabalho)'}],4:[{s:'40min',t:'Espanhol'},{s:'40min',t:'Leitura Espanhol'},{s:'40min',t:'Estudo IA (ex. Anthropic; leitura)'},{s:'40min',t:'EEA – Leitura'},{s:'Diário',t:'Execução Diária (Trabalho)'}],5:[{s:'40min',t:'Inglês'},{s:'40min',t:'Projeto Portix / Sites'},{s:'40min',t:'Projeto Gerador de Pareceres / Mascarador'},{s:'40min',t:'Estudos Contábeis'},{s:'Diário',t:'Execução Diária (Trabalho)'}],6:[{s:'40min',t:'Projeto Tese Abusividade de Juros'},{s:'40min',t:'Leitura'},{s:'40min',t:'Estatística'},{s:'40min',t:'Projeto Dodaia'},{s:'40min',t:'Leitura'}],0:[{s:'livre',t:'Revisão semanal'},{s:'livre',t:'Planejamento da semana'}]};
const CATS={trabalho:{bg:'var(--cat-trabalho-bg)',fg:'var(--cat-trabalho-fg)',acc:'var(--cat-trabalho-acc)',lbl:'Trabalho'},estudo:{bg:'var(--cat-estudo-bg)',fg:'var(--cat-estudo-fg)',acc:'var(--cat-estudo-acc)',lbl:'Estudo'},eea:{bg:'var(--cat-eea-bg)',fg:'var(--cat-eea-fg)',acc:'var(--cat-eea-acc)',lbl:'EEA'},projeto:{bg:'var(--cat-projeto-bg)',fg:'var(--cat-projeto-fg)',acc:'var(--cat-projeto-acc)',lbl:'Projeto'},leitura:{bg:'var(--cat-leitura-bg)',fg:'var(--cat-leitura-fg)',acc:'var(--cat-leitura-acc)',lbl:'Leitura'}};
function getcat(t){const l=t.toLowerCase();if(l.includes('eea'))return'eea';if(l.includes('leitura'))return'leitura';if(l.includes('estud')||l.includes('ingl')||l.includes('espanh')||l.includes('contab')||l.includes('ia')||l.includes('estat'))return'estudo';if(l.includes('projeto')||l.includes('portix')||l.includes('gerador')||l.includes('score')||l.includes('dodai')||l.includes('tese')||l.includes('gestão')||l.includes('mascarador'))return'projeto';return'trabalho';}
const DAY_FULL=['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
const DAY_SHORT=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const BL=['manhã','tarde','noite'];
let state={viewDow:new Date().getDay(),doneTasks:{},doneDays:[],notes:{}};
let blockMins=40,timerLeft=2400,timerTotal=2400,timerRunning=false,timerInterval=null,blocksCompleted=0;
let deferredInstall=null;
function loadState(){try{const s=localStorage.getItem('agenda_pwa_v1');if(s)state={...state,...JSON.parse(s)};}catch(e){}}
function saveState(){try{localStorage.setItem('agenda_pwa_v1',JSON.stringify(state));}catch(e){}}
function applyColors(dow){const tasks=SCHED[dow]||[];const c=tasks.length?CATS[getcat(tasks[0].t)]:CATS.trabalho;const r=document.documentElement;r.style.setProperty('--active-acc',c.acc);r.style.setProperty('--active-bg',c.bg);r.style.setProperty('--active-fg',c.fg);const pb=document.getElementById('play-btn');if(pb){pb.style.background=c.acc;pb.style.borderColor=c.acc;}}
function ap(cx,cy,r,deg){if(deg>=360)return`M${cx},${cy-r} A${r},${r},0,1,1,${cx-.001},${cy-r} Z`;if(deg<=0)return'';const rad=(deg-90)*Math.PI/180;const ex=cx+r*Math.cos(rad-Math.PI/2);const ey=cy+r*Math.sin(rad-Math.PI/2);return`M${cx},${cy} L${cx},${cy-r} A${r},${r},0,${deg>180?1:0},1,${ex},${ey} Z`;}
function getAcc(){return getComputedStyle(document.documentElement).getPropertyValue('--active-acc').trim()||'#185FA5';}
function updateDiscs(){
  const bPct=timerLeft/timerTotal;
  const acc=getAcc();
  document.getElementById('arc-bloco').setAttribute('d',ap(36,36,33,bPct*360));
  document.getElementById('arc-bloco').setAttribute('fill',acc);
  document.getElementById('tarc').setAttribute('d',ap(50,50,46,bPct*360));
  document.getElementById('tarc').setAttribute('fill',acc);
  document.getElementById('lbl-bloco').textContent=Math.ceil(timerLeft/60);
  document.getElementById('svg-m').textContent=Math.ceil(timerLeft/60);
  const focusCount=(SCHED[state.viewDow]||[]).filter(t=>t.s==='40min').length;
  const focusMins=focusCount*blockMins;
  const compMins=blocksCompleted*blockMins+(blockMins-timerLeft/60);
  const fPct=focusMins>0?Math.min(compMins/focusMins,1):0;
  document.getElementById('arc-foco').setAttribute('d',ap(58,58,54,fPct*360));
  document.getElementById('lbl-foco').textContent=Math.max(0,focusCount-blocksCompleted);
  document.getElementById('bot-foco').textContent=focusMins+' min foco';
  document.getElementById('leg-n').textContent=focusCount;
  document.getElementById('ratio1').textContent='1/'+focusCount;
  document.getElementById('ratio2').textContent='1/'+Math.round(1440/Math.max(focusMins,1));
  document.getElementById('bot-bloco').textContent=blockMins+' min / bloco';
  document.getElementById('timer-lbl').textContent=blockMins+' min / bloco';
  const now=new Date();
  const el=now.getHours()*60+now.getMinutes();
  document.getElementById('arc-dia').setAttribute('d',ap(85,85,80,(el/1440)*360));
  document.getElementById('lbl-dia').textContent=now.getHours()+'h'+String(now.getMinutes()).padStart(2,'0');
}
function setMins(m){blockMins=m;timerTotal=m*60;timerLeft=m*60;if(timerRunning){clearInterval(timerInterval);timerRunning=false;}document.getElementById('play-btn').textContent='▶ Iniciar';[40,25,20,10].forEach(x=>{document.getElementById('p'+x).className='pbtn'+(x===m?' sel':'');});updateTimerDisplay();updateDiscs();}
function toggleTimer(){if(timerRunning){clearInterval(timerInterval);timerRunning=false;document.getElementById('play-btn').textContent='▶ Continuar';}else{if(timerLeft<=0){timerLeft=timerTotal;blocksCompleted=0;}timerRunning=true;document.getElementById('play-btn').textContent='⏸ Pausar';timerInterval=setInterval(tick,1000);}}
function resetTimer(){clearInterval(timerInterval);timerRunning=false;timerLeft=timerTotal;blocksCompleted=0;document.getElementById('play-btn').textContent='▶ Iniciar';updateTimerDisplay();updateDiscs();}
function tick(){timerLeft--;updateTimerDisplay();updateDiscs();if(timerLeft<=0){blocksCompleted++;clearInterval(timerInterval);timerRunning=false;timerLeft=timerTotal;document.getElementById('play-btn').textContent='▶ Próximo';document.getElementById('t-task').textContent='✓ Bloco '+blocksCompleted+' concluído!';try{if(navigator.vibrate)navigator.vibrate([200,100,200]);}catch(e){}}}
function updateTimerDisplay(){const mm=Math.floor(timerLeft/60),ss=timerLeft%60;document.getElementById('t-display').textContent=String(mm).padStart(2,'0')+':'+String(ss).padStart(2,'0');}
function nextTask(){const dow=state.viewDow;const tasks=SCHED[dow]||[];const f=tasks.find((_,i)=>!state.doneTasks[dow+'_'+i]);return f?f.t:'Sem tarefas pendentes';}
function render(){
  const dow=state.viewDow;
  applyColors(dow);
  document.getElementById('hd-day').textContent=DAY_FULL[dow];
  const now=new Date();
  const diff=(dow-now.getDay()+7)%7;
  const d=new Date(now);d.setDate(now.getDate()+diff);
  document.getElementById('hd-date').textContent=d.toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'});
  const bi=now.getHours()<12?0:now.getHours()<18?1:2;
  document.getElementById('block-badge').textContent='Bloco '+(bi+1)+' · '+BL[bi];
  renderTasks();renderWeek();renderStats();updateDiscs();
  document.getElementById('notes-ta').value=state.notes['n_'+dow]||'';
  document.getElementById('t-task').textContent=nextTask();
}
function renderTasks(){const dow=state.viewDow;const tasks=SCHED[dow]||[];document.getElementById('today-tasks').innerHTML=tasks.map((tk,i)=>{const key=dow+'_'+i;const done=!!state.doneTasks[key];const c=CATS[getcat(tk.t)];return`<div class="task-row${done?' done':''}" onclick="toggleTask(${dow},${i})"><div class="task-check">${done?'✓':''}</div><div class="task-slot">${tk.s}</div><div class="task-name">${tk.t}</div><span class="cat-pill" style="background:${c.bg};color:${c.fg}">${c.lbl}</span></div>`;}).join('');}
function toggleTask(dow,i){const key=dow+'_'+i;state.doneTasks[key]=!state.doneTasks[key];const todayKey=new Date().toISOString().slice(0,10);const anyDone=Object.keys(state.doneTasks).some(k=>k.startsWith(dow+'_')&&state.doneTasks[k]);if(anyDone&&!state.doneDays.includes(todayKey))state.doneDays.push(todayKey);saveState();renderTasks();renderWeek();renderStats();}
function renderWeek(){const today=new Date();const mon=new Date(today);mon.setDate(today.getDate()-((today.getDay()+6)%7));document.getElementById('week-strip').innerHTML=[1,2,3,4,5,6,0].map(dow=>{const off=(dow===0?6:dow-1);const d=new Date(mon);d.setDate(mon.getDate()+off);const key=d.toISOString().slice(0,10);const isToday=d.toDateString()===today.toDateString();const isView=dow===state.viewDow;const hasDone=state.doneDays.includes(key);return`<div class="wday${(isToday||isView)?' active-day':''}${hasDone?' has-done':''}" onclick="switchDay(${dow})"><div class="wday-name">${DAY_SHORT[dow]}</div><div class="wday-num">${d.getDate()}</div><div class="wday-dot"></div></div>`;}).join('');}
function switchDay(dow){state.viewDow=dow;render();}
function prevDay(){state.viewDow=(state.viewDow+6)%7;render();}
function nextDay(){state.viewDow=(state.viewDow+1)%7;render();}
function renderStats(){const dow=state.viewDow;const tasks=SCHED[dow]||[];const done=tasks.filter((_,i)=>state.doneTasks[dow+'_'+i]).length;document.getElementById('s-done').textContent=done;document.getElementById('s-mins').textContent=done*blockMins;let streak=0,d=new Date();for(let i=0;i<365;i++){if(state.doneDays.includes(d.toISOString().slice(0,10))){streak++;d.setDate(d.getDate()-1);}else break;}document.getElementById('s-streak').textContent=streak;}
document.getElementById('notes-ta').addEventListener('input',e=>{state.notes['n_'+state.viewDow]=e.target.value;saveState();});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;document.getElementById('install-banner').classList.add('show');});
function installPWA(){if(!deferredInstall)return;deferredInstall.prompt();deferredInstall.userChoice.then(()=>{deferredInstall=null;document.getElementById('install-banner').classList.remove('show');});}
window.addEventListener('appinstalled',()=>document.getElementById('install-banner').classList.remove('show'));
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
setInterval(()=>updateDiscs(),60000);
loadState();render();updateTimerDisplay();updateDiscs();
</script>
</body>
</html>
